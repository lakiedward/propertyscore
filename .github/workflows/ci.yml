name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm i18n:check
      - run: pnpm test:run
      - run: pnpm knip
        continue-on-error: true
      - run: pnpm build
        env:
          VITE_APP_ENV: production
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ci-build-placeholder
          VITE_SITE_URL: https://example.netlify.app

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Allocate Supabase ports outside the runner's ephemeral range
        run: |
          python3 - <<'PY'
          import errno
          import os
          import socket
          from pathlib import Path

          ephemeral_start = int(Path("/proc/sys/net/ipv4/ip_local_port_range").read_text().split()[0])

          def available_ports():
              for port in range(15420, ephemeral_start):
                  try:
                      with socket.create_server(("::", port), family=socket.AF_INET6, dualstack_ipv6=True):
                          pass
                  except OSError as error:
                      if error.errno != errno.EADDRINUSE:
                          raise
                  else:
                      yield port
              raise RuntimeError("Not enough available Supabase ports below the ephemeral range")

          ports = available_ports()
          with open(os.environ["GITHUB_ENV"], "a") as env:
              for setting in ("DB_PORT", "DB_SHADOW_PORT", "API_PORT", "STUDIO_PORT", "LOCAL_SMTP_PORT", "EDGE_RUNTIME_INSPECTOR_PORT"):
                  env.write(f"SUPABASE_{setting}={next(ports)}\n")
          PY
      - name: Start Supabase
        id: supabase
        shell: bash
        run: |
          pnpm exec supabase start
          db_url=$(pnpm exec supabase status -o json | jq -er '.DB_URL')
          printf 'db_url=%s\n' "$db_url" >> "$GITHUB_OUTPUT"
      - run: pnpm db:lint
      - run: pnpm db:test
      - name: Restore the apt packages of the worker tests
        uses: actions/cache/restore@v4
        with:
          path: ~/apt-debs
          key: apt-debs-${{ runner.os }}-osmium-tool-unzip-gdal-bin-catdoc-poppler-utils
      - name: Install osmium and GDAL for the worker tests
        timeout-minutes: 5
        run: |
          apt_options="-o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20"
          packages="osmium-tool unzip gdal-bin catdoc poppler-utils"
          mkdir -p ~/apt-debs
          sudo cp -n ~/apt-debs/*.deb /var/cache/apt/archives/ 2>/dev/null || true
          sudo apt-get install --yes $apt_options $packages || {
            sudo apt-get update $apt_options
            sudo apt-get install --yes $apt_options $packages
          }
          cp -n /var/cache/apt/archives/*.deb ~/apt-debs/ 2>/dev/null || true
      - name: Save the apt packages of the worker tests
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/apt-debs
          key: apt-debs-${{ runner.os }}-osmium-tool-unzip-gdal-bin-catdoc-poppler-utils
      - name: Transit routing helpers
        run: python3 -m unittest discover --start-directory worker/transit
      - name: Worker tests against the local database
        run: pnpm test:worker
        env:
          DATABASE_URL: ${{ steps.supabase.outputs.db_url }}
      - name: Generated types match the migrations
        run: |
          pnpm db:types
          git diff --exit-code src/lib/supabase/database.types.ts
