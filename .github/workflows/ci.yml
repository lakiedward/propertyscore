name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm i18n:check
      - run: pnpm test:run
      - run: pnpm knip
        continue-on-error: true
      - run: pnpm build
        env:
          VITE_APP_ENV: production
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ci-build-placeholder
          VITE_SITE_URL: https://example.netlify.app

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec supabase start
      - run: pnpm db:lint
      - run: pnpm db:test
      - name: Restore the apt packages of the worker tests
        uses: actions/cache/restore@v4
        with:
          path: ~/apt-debs
          key: apt-debs-${{ runner.os }}-osmium-tool-unzip-gdal-bin-catdoc-poppler-utils
      - name: Install osmium and GDAL for the worker tests
        timeout-minutes: 5
        run: |
          apt_options="-o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20"
          packages="osmium-tool unzip gdal-bin catdoc poppler-utils"
          mkdir -p ~/apt-debs
          sudo cp -n ~/apt-debs/*.deb /var/cache/apt/archives/ 2>/dev/null || true
          sudo apt-get install --yes $apt_options $packages || {
            sudo apt-get update $apt_options
            sudo apt-get install --yes $apt_options $packages
          }
          cp -n /var/cache/apt/archives/*.deb ~/apt-debs/ 2>/dev/null || true
      - name: Save the apt packages of the worker tests
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/apt-debs
          key: apt-debs-${{ runner.os }}-osmium-tool-unzip-gdal-bin-catdoc-poppler-utils
      - name: Transit routing helpers
        run: python3 -m unittest discover --start-directory worker/transit
      - name: Worker tests against the local database
        run: pnpm test:worker
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      - name: Generated types match the migrations
        run: |
          pnpm db:types
          git diff --exit-code src/lib/supabase/database.types.ts
